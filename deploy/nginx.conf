# 教学工作台 · nginx 配置（自托管）
# 用法：复制到 /etc/nginx/sites-available/teaching-workbench 并软链到 sites-enabled
# 请把 server_name 与 root 改成你自己的域名与目录

server {
    listen 80;
    server_name teach.example.com;          # 改成你的域名或服务器 IP
    root /var/www/teaching-workbench;        # 仓库clone目录（含 index.html）
    index index.html;

    # 静态资源缓存
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 数据文件不缓存：改完 JSON 推送后刷新即生效
    location /data/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Webhook：GitHub push → 自动拉取更新（由 webhook.py 接收）
    location /hooks/deploy {
        proxy_pass http://127.0.0.1:9000/hooks/deploy;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header Content-Type $content_type;
    }
}
